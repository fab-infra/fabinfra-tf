# Default values for backups.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

backoffLimit: 0

image:
  repository: ghcr.io/fab-infra/backuptools
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

nodeSelector:
  server-role-infra: "true"

tolerations: []

affinity: {}

backends:
  ftp:
    host: ""      # ftpbackup.example.org
    dir: ""       # example
  gcs:
    bucket: ""    # example-org-backups
  s3:
    provider: ""  # OVH
    region: ""    # rbx
    bucket: ""    # example-org-backups
  swift:
    container: "" # example-org-backups

backups:
  sync:
    backends: ""  # swift,gcs
    args: ""      # pcs:container gcs:bucket

schedules: {}
  # sync: "0 5 * * *"

secrets:
  ftp:
    username: ""
    password: ""
  gcs:
    sa: ""
  s3:
    accessKeyId: ""
    secretAccessKey: ""
  swift:
    openrc: ""

env: {}
